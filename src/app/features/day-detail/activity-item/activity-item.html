<div class="flex gap-3 rounded-2xl border border-earth-700/40 bg-forest-900/60 p-3">
  <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-forest-800 text-xl" aria-hidden="true">
    {{ activity().icon ?? '✨' }}
  </div>
  <div class="min-w-0 flex-1">
    <div class="flex flex-wrap items-baseline justify-between gap-x-2">
      <h3 class="font-heading text-sm tracking-wide text-mystic-200">{{ activity().title }}</h3>
      @if (activity().time) {
        <span class="shrink-0 text-xs font-semibold text-mystic-400">{{ activity().time }}</span>
      }
    </div>
    <p class="mt-1 text-sm leading-snug text-forest-100/90">{{ activity().description }}</p>
    @if (activity().location) {
      <p class="mt-1.5 flex items-center gap-1 text-xs text-forest-200/70">
        <span aria-hidden="true">📍</span>
        <span>{{ activity().location }}</span>
      </p>
    }
  </div>
</div>
